name: Publish to npm

# Publishes @ripwords/myinvois-client to npm.
#
# Triggers:
#   - Push of a semver tag (v*.*.*) → publishes that version
#   - Manual dispatch → republishes whatever is currently in package.json
#     (recovery path for a tag whose publish failed; no GitHub Release is
#     created on this path)
#
# Auth — npm Trusted Publishing (OIDC), not a token. Modeled on the
# feedback-tool repo's publish-npm.yml:
#   - The package's Trusted Publisher config on npmjs.com must match:
#     repository: Ripwords/MyInvoisClient, workflow: publish.yml
#   - id-token: write lets npm validate the OIDC claims against that config,
#     and signs the provenance attestation (sigstore) shown on the package
#     page. No NPM_TOKEN secret, no OTP — ever.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun x vitest run test/unit
      - run: bun run build
      - run: bun run verify-dist

  publish:
    name: Publish @ripwords/myinvois-client
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # required for `gh release create`
      id-token: write # required for OIDC auth + provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # npm (not bun publish) does the final publish because npm has
      # first-class --provenance support. Node puts a recent npm on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing auth on the CLI landed in npm 11.5.1; the bundled
      # npm fails the OIDC handshake with a misleading 404. Pinned to the
      # major deliberately — npm@latest once jumped a Node engine floor and
      # broke publishes with EBADENGINE before ever reaching `npm publish`.
      - run: npm install -g npm@11

      - run: bun install --frozen-lockfile

      # Rebuild dist/ from source on the runner — `files` ships whatever is
      # on disk at publish time. Never trust local build artifacts.
      - run: bun run build
      - run: bun run verify-dist

      # Guard against tagging v0.7.0 while package.json still says 0.6.x.
      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME expects version $TAG_VERSION but package.json is at $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Create the GitHub Release from this version's CHANGELOG section.
      # Only on tag pushes — workflow_dispatch republishes don't get one.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Extract the section whose heading is exactly this version.
          awk -v ver="$TAG" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "error: no CHANGELOG.md section for $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
