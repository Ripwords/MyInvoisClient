name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Lint + typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Unit tests are deterministic and need no .env; the live sandbox suite
      # self-skips without RUN_INTEGRATION and is never run in CI.
      - run: bun x vitest run test/unit
      - run: bun run build
      - run: bun run verify-dist
